name: Deploy SkinForge to GitHub Pages
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Configure GitHub Pages
      id: configure
      continue-on-error: true
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
    - name: Upload static site
      id: upload
      if: steps.configure.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      with:
        path: .
    - name: Deploy to GitHub Pages
      id: deployment
      if: steps.configure.outcome == 'success' && steps.upload.outcome == 'success'
      continue-on-error: true
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
    - name: Record deployment diagnostic
      if: always()
      shell: bash
      env:
        CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
        UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        set -euo pipefail
        printf '### Pages deployment

        Configure: %s

        Upload: %s

        Deploy: %s

        URL: %s
        ' \
          "$CONFIGURE_OUTCOME" "$UPLOAD_OUTCOME" "$DEPLOY_OUTCOME" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
    - name: Verify deployment
      if: always()
      shell: bash
      env:
        DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
      run: |
        if [[ "${DEPLOY_OUTCOME:-skipped}" != "success" ]]; then
          echo "GitHub Pages deployment did not complete successfully." >&2
          exit 1
        fi
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Validate JavaScript syntax and site entry point
      run: |
        test -s index.html
        find . -path './.git' -prune -o -type f -name '*.js' -exec node --check {} +
